name: moderatornos

x-backend: &backend
  image: ghcr.io/dakarrs/moderatornos-backend:${IMAGE_TAG:?set IMAGE_TAG}
  env_file: .env
  environment:
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_DATABASE: moderatornos
    DB_USERNAME: moderatornos
    SESSION_DRIVER: database
    SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-true}
    CACHE_STORE: database
    QUEUE_CONNECTION: sync
  depends_on:
    postgres:
      condition: service_healthy

services:
  caddy:
    image: caddy:2.10.2-alpine
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend
      - frontend

  frontend:
    image: ghcr.io/dakarrs/moderatornos-frontend:${IMAGE_TAG:?set IMAGE_TAG}
    restart: always
    environment:
      API_URL: http://backend:8000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  backend:
    <<: *backend
    restart: always
    volumes:
      - avatars:/app/storage/app/public
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://localhost:8000/up') === false ? 1 : 0);"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Run once per deploy, before the new backend starts.
  migrate:
    <<: *backend
    profiles: [tools]
    command: ["php", "artisan", "migrate", "--force"]

  postgres:
    image: postgres:17.11-alpine
    restart: always
    environment:
      POSTGRES_DB: moderatornos
      POSTGRES_USER: moderatornos
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moderatornos -d moderatornos"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  avatars:
  caddy-config:
  caddy-data:
  postgres-data:
